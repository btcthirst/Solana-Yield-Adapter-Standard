name: Fork Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  ANCHOR_VERSION: "1.0.0"
  SOLANA_VERSION: "3.1.11"
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  fork-tests:
    name: Mainnet-fork integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            anchor-cli --tag v${{ env.ANCHOR_VERSION }} --locked --force

      - name: Install surfpool
        run: cargo install surfpool --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Generate local keypair
        run: solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json

      - name: Build programs
        run: anchor build

      - name: Start surfpool (mainnet fork, daemon mode)
        run: |
          NO_DNA=1 surfpool start \
            --network mainnet \
            --no-tui \
            --rpc-port 8899 \
            --datasource-rpc-url "${{ secrets.HELIUS_RPC_URL }}" \
            --daemon
          # Wait for surfpool to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8899/health > /dev/null 2>&1; then
              echo "surfpool ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run mainnet-fork tests
        env:
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: ~/.config/solana/id.json
        run: npm run test:fork

      - name: Stop surfpool
        if: always()
        run: pkill surfpool || true
