name: Fork Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  ANCHOR_VERSION: "1.0.0"
  SOLANA_VERSION: "3.1.11"
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  fork-tests:
    name: Mainnet-fork integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            anchor-cli --tag v${{ env.ANCHOR_VERSION }} --locked --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Generate local keypair
        run: solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json

      # Build runs for every push and PR (incl. forks) — validates compilation
      # without needing any secret.
      - name: Build programs
        run: anchor build

      # ── Fork-test steps below require the HELIUS_RPC_URL secret, which is not
      # available to PRs from forks. Gate them so external PRs still pass on the
      # build step, while push / same-repo PRs run the real fork tests and fail
      # loudly if the fork is misconfigured. ───────────────────────────────────

      - name: Require fork RPC secret
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "${{ secrets.HELIUS_RPC_URL }}" ]; then
            echo "::error::HELIUS_RPC_URL secret is not set — cannot run mainnet-fork tests."
            exit 1
          fi

      - name: Start surfpool (mainnet fork, daemon mode)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cargo install surfpool --locked
          NO_DNA=1 surfpool start \
            --network mainnet \
            --no-tui \
            --rpc-port 8899 \
            --datasource-rpc-url "${{ secrets.HELIUS_RPC_URL }}" \
            --daemon
          # Wait for surfpool to be ready, and FAIL the job if it never comes up.
          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8899/health > /dev/null 2>&1; then
              echo "surfpool ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::surfpool did not become ready within 30s."
            exit 1
          fi

      - name: Run mainnet-fork tests
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          FORK_REQUIRED: "1"
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: ~/.config/solana/id.json
        # --forbid-pending turns any skipped (pending) test into a failure, so a
        # silently-skipped suite can never report green in CI.
        run: npm run test:fork -- --forbid-pending

      - name: Stop surfpool
        if: always()
        run: pkill surfpool || true
