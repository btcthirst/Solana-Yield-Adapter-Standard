[package]
name = "registry"
version = "0.1.0"
edition = "2021"
description = "On-chain Adapter Registry for Solana Yield Adapter Standard"

[lib]
crate-type = ["cdylib", "lib"]
name = "registry"

[features]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }

[lints]
workspace = true
