[toolchain]
anchor_version = "1.0.0"
solana_version = "3.1.11"

[features]
resolution = true
skip-lint = false

[programs.localnet]
dispatcher = "F6QyZM6rb5i1bDsW9gQMrPBVzZeEfSRbR2JDzDQTJuQ1"
drift_adapter = "BYT5wbAodWevNJRLnaU2Qe87prHWqycBoZh3oWnCXeY8"
jupiter_lp_adapter = "7JVMN1WEVmXGFdAu5AQsGFfxEAjoL2uD79hEzeo9115E"
kamino_adapter = "5ksJ5dU6jAoZaUnpcXtGN69xXewcRcGLTBisQHSkwc44"
maple_adapter = "EuffaJ2ccu1PnppDd5rTBxPvFXA4u8YQKDj6DyqsyVot"
marginfi_adapter = "47aSt3hDuDSW1RFz2Qbi9tUc5V7HMotJU3zyiqrkZ9zz"
registry = "4NP3DgbM7JJDBQEiU9ojUJ3yYnCoEnbBCsACfQz32xdB"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS='--no-experimental-strip-types' npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]

[surfpool]
startup_wait = 20000
shutdown_wait = 2000
rpc_port = 8899
host = "127.0.0.1"
log_level = "info"
# Preload these mainnet accounts at startup (null = fetch from datasource RPC)
# Run: SURFPOOL_DATASOURCE_RPC_URL=https://api.mainnet-beta.solana.com anchor test --skip-build
snapshot = "tests/fixtures/mainnet-accounts.json"
